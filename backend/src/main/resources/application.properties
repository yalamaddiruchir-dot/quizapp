server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:change_me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
app.admin.password=${ADMIN_PASSWORD:admin123}
